name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**
      - .github/**

pr:
  branches:
    include:
      - main
      - develop

variables:
  - name: azureSubscription
    value: 'Azure Prod' # Replace with your actual service connection name from Azure DevOps
  # REQUIRED: Add these as secret variables in Azure DevOps Pipeline Variables:
  # - JWT_SECRET_KEY (generate with: openssl rand -base64 32)
  # - STRIPE_SECRET_KEY
  # - STRIPE_WEBHOOK_SECRET
  # - GOOGLE_CLIENT_ID
  # - STRIPE_PUBLIC_KEY
  # - FRONTEND_URL (e.g., https://your-static-web-app.azurestaticapps.net)
  - name: resourceGroupName
    value: 'rg-icon-generator'
  - name: location
    value: 'eastus'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: nodeVersion
    value: '18.x'
  - name: 'webAppName'
    value: 'webapi-icon-generator' # Static web app name
  - name: 'environment'
    value: 'prod'

stages:
  # ============================================
  # Stage 1: Infrastructure Deployment
  # ============================================
  - stage: Infrastructure
    displayName: 'Deploy Infrastructure'
    jobs:
      - job: DeployBicep
        displayName: 'Deploy Bicep Templates'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy Bicep Template'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Validate required secrets
                if [ -z "$(JWT_SECRET_KEY)" ]; then
                  echo "❌ ERROR: JWT_SECRET_KEY is required but not set"
                  echo "Add it as a secret variable in Azure DevOps Pipeline Variables"
                  exit 1
                fi
                
                echo "🚀 Starting infrastructure deployment..."
                
                az deployment group create \
                  --resource-group $(resourceGroupName) \
                  --template-file infrastructure/main.bicep \
                  --parameters infrastructure/parameters.dev.json \
                  --parameters location=$(location) \
                  --parameters environment=$(environment) \
                  --parameters jwtSecretKey="$(JWT_SECRET_KEY)" \
                  --parameters stripeSecretKey="$(STRIPE_SECRET_KEY)" \
                  --parameters stripeWebhookSecret="$(STRIPE_WEBHOOK_SECRET)" \
                  --parameters googleClientId="$(GOOGLE_CLIENT_ID)" \
                  --parameters frontendUrl="$(FRONTEND_URL)" \
                  --name infrastructure-deployment
                
                # Verify Static Web App was created
                STATIC_APP_EXISTS=$(az staticwebapp show \
                  --name icon-generator-pro \
                  --resource-group $(resourceGroupName) \
                  --query "name" -o tsv 2>/dev/null || echo "")
                
                if [ -z "$STATIC_APP_EXISTS" ]; then
                  echo "❌ ERROR: Static Web App was not created!"
                  exit 1
                else
                  echo "✅ Static Web App 'icon-generator-pro' created successfully"
                fi

                echo "✅ Infrastructure deployment completed"

  # ============================================
  # Stage 2: Build Backend (ASP.NET Core Web API)
  # ============================================
  - stage: BuildBackend
    displayName: 'Build Backend'
    dependsOn: Infrastructure
    jobs:
      - job: BuildWebAPI
        displayName: 'Build Web API'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: '10.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: 'api-webapi/IconGenerator.WebApi/IconGenerator.WebApi.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'Build Web API'
            inputs:
              command: 'build'
              projects: 'api-webapi/IconGenerator.WebApi/IconGenerator.WebApi.csproj'
              arguments: '--configuration Release'

          - task: DotNetCoreCLI@2
            displayName: 'Publish Web API'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'api-webapi/IconGenerator.WebApi/IconGenerator.WebApi.csproj'
              arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/webapi'
              zipAfterPublish: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Web API Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/webapi'
              ArtifactName: 'webapi'
              publishLocation: 'Container'

  # ============================================
  # Stage 3: Build Frontend (React) - DISABLED
  # Frontend is deployed via Static Web Apps
  # ============================================
  # - stage: BuildFrontend
  #   displayName: 'Build Frontend'
  #   jobs:
  #     - job: BuildReact
  #       displayName: 'Build React App'
  #       ... (frontend build tasks disabled)

  # ============================================
  # Stage 3: Deploy Backend (ASP.NET Core Web API)
  # ============================================
  - stage: DeployBackend
    displayName: 'Deploy Backend'
    dependsOn: BuildBackend
    jobs:
      - deployment: DeployWebAPI
        displayName: 'Deploy Web API'
        environment: 'production'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: webapi
                  displayName: 'Download Web API Artifact'

                - task: AzureWebApp@1
                  displayName: 'Deploy to Azure Web App'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'webAppLinux'
                    appName: '$(webAppName)-$(environment)'
                    package: '$(Pipeline.Workspace)/webapi/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'

  # ============================================
  # Stage 4: Configure Static Web App
  # ============================================
  - stage: ConfigureStaticWebApp
    displayName: 'Configure Static Web App'
    dependsOn: DeployBackend
    jobs:
      - job: SetEnvironmentVariables
        displayName: 'Set Environment Variables'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Configure Static Web App Environment Variables'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Get Web App name from deployment outputs
                WEB_APP_NAME=$(az deployment group show \
                  --resource-group $(resourceGroupName) \
                  --name infrastructure-deployment \
                  --query properties.outputs.webAppName.value \
                  --output tsv)

                # Get Web App URL
                WEB_APP_URL=$(az webapp show \
                  --resource-group $(resourceGroupName) \
                  --name $WEB_APP_NAME \
                  --query defaultHostName \
                  --output tsv)

                # Static Web App name (using static name)
                STATIC_APP_NAME="icon-generator-pro"

                echo "Configuring Static Web App: $STATIC_APP_NAME"
                echo "Web App URL: https://$WEB_APP_URL/api"

                # Set environment variables for Static Web App
                az staticwebapp appsettings set \
                  --name $STATIC_APP_NAME \
                  --resource-group $(resourceGroupName) \
                  --setting-names \
                    VITE_API_ENDPOINT="https://$WEB_APP_URL/api" \
                    VITE_GOOGLE_CLIENT_ID="$(GOOGLE_CLIENT_ID)" \
                    VITE_STRIPE_PUBLIC_KEY="$(STRIPE_PUBLIC_KEY)"

                echo "✅ Static Web App environment variables configured successfully"
                echo "   - VITE_API_ENDPOINT: https://$WEB_APP_URL/api"
                echo "   - VITE_GOOGLE_CLIENT_ID: [CONFIGURED]"
                echo "   - VITE_STRIPE_PUBLIC_KEY: [CONFIGURED]"
