name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**

pr:
  branches:
    include:
      - main
      - develop

variables:
  - name: azureSubscription
    value: 'Azure PROD' # Azure service connection name
  # Note: Add variable group 'icon-generator-variables' in Azure DevOps Library if needed
  - name: resourceGroupName
    value: 'rg-icon-generator'
  - name: location
    value: 'eastus'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: nodeVersion
    value: '18.x'

stages:
  # ============================================
  # Stage 1: Infrastructure Deployment
  # NOTE: Commented out until Azure service connection is created
  # Create service connection in Azure DevOps: Project Settings > Service connections > New > Azure Resource Manager
  # ============================================
  # - stage: Infrastructure
  #   displayName: 'Deploy Infrastructure'
  #   jobs:
  #     - job: DeployBicep
  #       displayName: 'Deploy Bicep Templates'
  #       pool:
  #         vmImage: $(vmImageName)
  #       steps:
  #         - task: AzureCLI@2
  #           ... (Infrastructure deployment tasks disabled)

  # ============================================
  # Stage 2: Build Backend (Azure Functions)
  # ============================================
  - stage: BuildBackend
    displayName: 'Build Backend'
    # dependsOn: Infrastructure  # Commented out - remove dependency on Infrastructure stage
    jobs:
      - job: BuildFunctions
        displayName: 'Build Azure Functions'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: '10.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: 'api/IconGenerator.Functions.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'Build Functions'
            inputs:
              command: 'build'
              projects: 'api/IconGenerator.Functions.csproj'
              arguments: '--configuration Release'

          - task: DotNetCoreCLI@2
            displayName: 'Publish Functions'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'api/IconGenerator.Functions.csproj'
              arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/functions'
              zipAfterPublish: false

          - task: ArchiveFiles@2
            displayName: 'Archive Functions'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/functions'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/functions.zip'
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Function Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/functions.zip'
              ArtifactName: 'functions'
              publishLocation: 'Container'

  # ============================================
  # Stage 3: Build Frontend (React)
  # ============================================
  - stage: BuildFrontend
    displayName: 'Build Frontend'
    # dependsOn: Infrastructure  # Commented out - remove dependency on Infrastructure stage
    jobs:
      - job: BuildReact
        displayName: 'Build React App'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js'
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              cd frontend
              npm ci
              npm run build
            displayName: 'Install Dependencies & Build'
            env:
              VITE_API_BASE_URL: $(VITE_API_BASE_URL)
              VITE_STRIPE_PUBLISHABLE_KEY: $(VITE_STRIPE_PUBLISHABLE_KEY)

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Frontend Artifact'
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/frontend/dist'
              ArtifactName: 'frontend'
              publishLocation: 'Container'

  # ============================================
  # Deployment stages commented out until service connection is authorized
  # To enable: Authorize "Azure PROD" service connection in Azure DevOps
  # Project Settings > Service connections > Azure PROD > Security > Grant access to all pipelines
  # ============================================
  
  # - stage: DeployBackend
  #   displayName: 'Deploy Backend'
  #   dependsOn: BuildBackend
  #   ... (deployment tasks)
  
  # - stage: DeployFrontend
  #   displayName: 'Deploy Frontend'
  #   dependsOn: BuildFrontend
  #   ... (deployment tasks)
  
  # - stage: PostDeployment
  #   displayName: 'Post-Deployment Configuration'
  #   dependsOn: [DeployBackend, DeployFrontend]
  #   ... (configuration tasks)
  
  # - stage: SmokeTests
  #   displayName: 'Smoke Tests'
  #   dependsOn: [DeployBackend, DeployFrontend]
  #   ... (test tasks)

