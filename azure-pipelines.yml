name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**
      - .github/**

pr:
  branches:
    include:
      - main
      - develop

variables:
  - name: azureSubscription
    value: 'Azure Prod' # Replace with your actual service connection name from Azure DevOps
  # Add these as secret variables in Azure DevOps Pipeline Variables:
  # - GOOGLE_CLIENT_ID
  # - STRIPE_PUBLIC_KEY
  - name: resourceGroupName
    value: 'rg-icon-generator'
  - name: location
    value: 'eastus'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: nodeVersion
    value: '18.x'
  - name: 'functionAppName'
    value: 'func-icon-generator' # Static function app name
  - name: 'environment'
    value: 'prod'

stages:
  # ============================================
  # Stage 1: Infrastructure Deployment
  # ============================================
  - stage: Infrastructure
    displayName: 'Deploy Infrastructure'
    jobs:
      - job: DeployBicep
        displayName: 'Deploy Bicep Templates'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy Bicep Template'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --resource-group $(resourceGroupName) \
                  --template-file infrastructure/main.bicep \
                  --parameters infrastructure/parameters.dev.json \
                  --parameters location=$(location) \
                  --parameters functionAppName=$(functionAppName) \
                  --parameters environment=$(environment) \
                  --name infrastructure-deployment
                
                echo "✅ Infrastructure deployment completed"

  # ============================================
  # Stage 2: Build Backend (Azure Functions)
  # ============================================
  - stage: BuildBackend
    displayName: 'Build Backend'
    dependsOn: Infrastructure
    jobs:
      - job: BuildFunctions
        displayName: 'Build Azure Functions'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: '10.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: 'api/IconGenerator.Functions.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'Build Functions'
            inputs:
              command: 'build'
              projects: 'api/IconGenerator.Functions.csproj'
              arguments: '--configuration Release'

          - task: DotNetCoreCLI@2
            displayName: 'Publish Functions'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'api/IconGenerator.Functions.csproj'
              arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/functions'
              zipAfterPublish: false

          - task: ArchiveFiles@2
            displayName: 'Archive Functions'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/functions'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/functions.zip'
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Function Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/functions.zip'
              ArtifactName: 'functions'
              publishLocation: 'Container'

  # ============================================
  # Stage 3: Build Frontend (React) - DISABLED
  # Only building Azure Functions for now
  # ============================================
  # - stage: BuildFrontend
  #   displayName: 'Build Frontend'
  #   jobs:
  #     - job: BuildReact
  #       displayName: 'Build React App'
  #       ... (frontend build tasks disabled)

  # ============================================
  # Stage 3: Deploy Backend (Azure Functions)
  # ============================================
  - stage: DeployBackend
    displayName: 'Deploy Backend'
    dependsOn: BuildBackend
    jobs:
      - deployment: DeployFunctions
        displayName: 'Deploy Azure Functions'
        environment: 'production'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: functions
                  displayName: 'Download Function Artifact'

                - task: AzureFunctionApp@2
                  displayName: 'Deploy to Azure Functions'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'functionAppLinux'
                    appName: '$(functionAppName)-$(environment)'
                    package: '$(Pipeline.Workspace)/functions/functions.zip'
                    runtimeStack: 'DOTNET-ISOLATED|10.0'
                    deploymentMethod: 'auto'

  # ============================================
  # Stage 4: Configure Static Web App
  # ============================================
  - stage: ConfigureStaticWebApp
    displayName: 'Configure Static Web App'
    dependsOn: DeployBackend
    jobs:
      - job: SetEnvironmentVariables
        displayName: 'Set Environment Variables'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Configure Static Web App Environment Variables'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Get Function App name from deployment outputs
                FUNC_APP_NAME=$(az deployment group show \
                  --resource-group $(resourceGroupName) \
                  --name infrastructure-deployment \
                  --query properties.outputs.functionAppName.value \
                  --output tsv)
                
                # Get Function App URL
                FUNC_APP_URL=$(az functionapp show \
                  --resource-group $(resourceGroupName) \
                  --name $FUNC_APP_NAME \
                  --query defaultHostName \
                  --output tsv)
                
                # Static Web App name (using static name)
                STATIC_APP_NAME="icon-generator-pro"
                
                echo "Configuring Static Web App: $STATIC_APP_NAME"
                echo "Function App URL: https://$FUNC_APP_URL/api"
                
                # Set environment variables for Static Web App
                az staticwebapp appsettings set \
                  --name $STATIC_APP_NAME \
                  --resource-group $(resourceGroupName) \
                  --setting-names \
                    VITE_API_ENDPOINT="https://$FUNC_APP_URL/api" \
                    VITE_GOOGLE_CLIENT_ID="$(GOOGLE_CLIENT_ID)" \
                    VITE_STRIPE_PUBLIC_KEY="$(STRIPE_PUBLIC_KEY)"
                
                echo "✅ Static Web App environment variables configured successfully"
                echo "   - VITE_API_ENDPOINT: https://$FUNC_APP_URL/api"
                echo "   - VITE_GOOGLE_CLIENT_ID: [CONFIGURED]"
                echo "   - VITE_STRIPE_PUBLIC_KEY: [CONFIGURED]"
