name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**
      - .github/**

pr:
  branches:
    include:
      - main
      - develop

variables:
  - name: azureSubscription
    value: 'Azure PROD' # Azure service connection name
  # Note: Add variable group 'icon-generator-variables' in Azure DevOps Library if needed
  - name: resourceGroupName
    value: 'rg-icon-generator'
  - name: location
    value: 'eastus'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: nodeVersion
    value: '18.x'

stages:
  # ============================================
  # Stage 1: Infrastructure Deployment
  # ============================================
  - stage: Infrastructure
    displayName: 'Deploy Infrastructure'
    jobs:
      - job: DeployBicep
        displayName: 'Deploy Bicep Templates'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy Bicep Template'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --resource-group $(resourceGroupName) \
                  --template-file infrastructure/main.bicep \
                  --parameters infrastructure/parameters.dev.json \
                  --parameters location=$(location)

  # ============================================
  # Stage 2: Build Backend (Azure Functions)
  # ============================================
  - stage: BuildBackend
    displayName: 'Build Backend'
    dependsOn: Infrastructure
    jobs:
      - job: BuildFunctions
        displayName: 'Build Azure Functions'
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              version: '10.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: 'api/IconGenerator.Functions.csproj'

          - task: DotNetCoreCLI@2
            displayName: 'Build Functions'
            inputs:
              command: 'build'
              projects: 'api/IconGenerator.Functions.csproj'
              arguments: '--configuration Release'

          - task: DotNetCoreCLI@2
            displayName: 'Publish Functions'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: 'api/IconGenerator.Functions.csproj'
              arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/functions'
              zipAfterPublish: false

          - task: ArchiveFiles@2
            displayName: 'Archive Functions'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/functions'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/functions.zip'
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Function Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/functions.zip'
              ArtifactName: 'functions'
              publishLocation: 'Container'

  # ============================================
  # Stage 3: Build Frontend (React) - DISABLED
  # Only building Azure Functions for now
  # ============================================
  # - stage: BuildFrontend
  #   displayName: 'Build Frontend'
  #   jobs:
  #     - job: BuildReact
  #       displayName: 'Build React App'
  #       ... (frontend build tasks disabled)

  # ============================================
  # Stage 3: Deploy Backend (Azure Functions)
  # ============================================
  - stage: DeployBackend
    displayName: 'Deploy Backend'
    dependsOn: BuildBackend
    jobs:
      - deployment: DeployFunctions
        displayName: 'Deploy Azure Functions'
        environment: 'production'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: functions
                  displayName: 'Download Function Artifact'

                - task: AzureCLI@2
                  displayName: 'Get Function App Name'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      functionAppName=$(az deployment group show \
                        --resource-group $(resourceGroupName) \
                        --name main \
                        --query properties.outputs.functionAppName.value \
                        --output tsv)
                      echo "##vso[task.setvariable variable=functionAppName]$functionAppName"

                - task: AzureFunctionApp@2
                  displayName: 'Deploy to Azure Functions'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: 'functionAppLinux'
                    appName: $(functionAppName)
                    package: '$(Pipeline.Workspace)/functions/functions.zip'
                    runtimeStack: 'DOTNET-ISOLATED|10.0'
                    deploymentMethod: 'auto'

